<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{{ book.title }} · Bookshelf</title>
  <link rel="icon" href="{{ static('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static('css/app.css') }}">
  <link rel="stylesheet" href="{{ static('css/reader.css') }}">
  <script type="importmap">{{ reader_import_map()|tojson }}</script>
</head>
<body class="reader-page">
  <header class="reader-bar reader-bar-top" id="reader-top" aria-label="Reader toolbar"></header>

  <main id="reader">
    <foliate-view id="view"></foliate-view>
    <p class="reader-status" id="reader-status" role="status">Opening book…</p>
  </main>

  <footer class="reader-bar reader-bar-bottom" id="reader-bottom" aria-label="Reader navigation"></footer>

  <div class="chapter-hint" id="chapter-hint" aria-hidden="true">
    <span class="ch-label"></span>
    <span class="ch-meter"><span></span></span>
  </div>

  <div class="reader-scrim" id="reader-scrim" hidden></div>

  <aside class="reader-panel reader-panel-start" data-panel="toc" aria-label="Contents" hidden>
    <div class="panel-head">
      <h2>Contents</h2>
      <button type="button" class="rb-btn" data-close aria-label="Close">{{ icon('x', 20) }}</button>
    </div>
    <nav class="panel-body toc"></nav>
  </aside>

  <aside class="reader-panel reader-panel-end" data-panel="settings" aria-label="Reader settings" hidden>
    <div class="panel-head">
      <h2>Reader settings</h2>
      <button type="button" class="rb-btn" data-close aria-label="Close">{{ icon('x', 20) }}</button>
    </div>
    <div class="panel-body settings"></div>
  </aside>

  <dialog class="sync-dialog" id="sync-dialog" aria-labelledby="sync-title">
    <form method="dialog">
      <h2 id="sync-title">Continue where?</h2>
      <p class="sync-lead">This book was read on another device since you were last here.</p>
      <button class="sync-choice" value="remote" autofocus>
        <span class="sync-device" data-remote-device></span>
        <span class="sync-where" data-remote-where></span>
      </button>
      <button class="sync-choice" value="local">
        <span class="sync-device">This browser</span>
        <span class="sync-where" data-local-where></span>
      </button>
      <label class="sync-always"><input type="checkbox" name="always"> Always use the latest position</label>
    </form>
  </dialog>

  <template id="reader-icons">
    {%- for name, svg in reader_icons.items() %}
    <span data-icon="{{ name }}">{{ svg }}</span>
    {%- endfor %}
  </template>
  <script type="application/json" id="reader-bootstrap">{{ bootstrap|tojson }}</script>
  <script type="module" src="{{ static('js/reader/main.js') }}"></script>
</body>
</html>
